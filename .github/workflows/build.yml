name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          set +e
          gradle assembleDebug --stacktrace > build_log.txt 2>&1
          BUILD_EXIT_CODE=$?
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "=========================================="
            echo "ОШИБКА КОМПИЛЯЦИИ (СКОПИРУЙТЕ ЭТО):"
            echo "=========================================="
            grep -E "^e: " build_log.txt || tail -n 100 build_log.txt
            exit $BUILD_EXIT_CODE
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iptv-player-debug
          path: app/build/outputs/apk/debug/app-debug.apk
